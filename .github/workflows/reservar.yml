name: Automação Reserva Deskbee

on:
  schedule:
    # 03:01 UTC corresponde às 00:01 no Horário de Brasília (UTC-3)
    # Roda de Domingo a Quinta para garantir reservas de Segunda a Sexta
    - cron: '1 3 * * *'
  
  # Permite que você clique em um botão no GitHub para rodar manualmente quando quiser testar!
  workflow_dispatch:

jobs:
  executar-reserva:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar o Script de Reserva
        env:
          DESKBEE_ACCOUNT: ${{ secrets.DESKBEE_ACCOUNT }}
          DESKBEE_EMAIL: ${{ secrets.DESKBEE_EMAIL }}
          DESKBEE_PASSWORD: ${{ secrets.DESKBEE_PASSWORD }}
        run: python main.py
